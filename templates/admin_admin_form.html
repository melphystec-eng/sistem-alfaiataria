{% extends "base.html" %}{% block title %}Novo Administrador{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
  <h1><i class="fa-solid fa-user-plus" style="color: var(--azul);"></i> Novo Administrador</h1>
  <form method="post">

    <div class="form-group">
      <label><i class="fa-solid fa-user"></i> Nome de Utilizador</label>
      <input name="username" required placeholder="Ex: joao_silva">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-lock"></i> Senha</label>
      <input type="password" name="password" required placeholder="Mínimo 6 caracteres">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-check-double"></i> Confirmar Senha</label>
      <input type="password" name="confirmar" required placeholder="Repita a senha">
    </div>

    <div style="display: flex; gap: 10px; margin-top: 25px;">
      <button type="submit"><i class="fa-solid fa-user-check"></i> Criar Administrador</button>
      <a href="{{ url_for('admin_admins') }}" class="btn" style="background: var(--cinza-100); color: var(--preto); box-shadow: none;"><i class="fa-solid fa-xmark"></i> Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
