{% extends "base.html" %}{% block title %}Adicionar Foto{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h1><i class="fa-solid fa-camera" style="color: var(--azul);"></i> Adicionar Foto à Galeria</h1>
  <form method="post" enctype="multipart/form-data">
    
    <div class="form-group">
      <label><i class="fa-solid fa-tag"></i> Legenda (Opcional)</label>
      <input name="titulo" placeholder="Ex: Terno sob medida para casamento">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-image"></i> Ficheiro da Imagem</label>
      <input type="file" name="imagem" accept="image/*" required style="padding: 10px; background: #fff; border: 1.5px dashed var(--cinza-300);">
    </div>

    <div style="display: flex; gap: 10px; margin-top: 25px;">
      <button type="submit"><i class="fa-solid fa-cloud-arrow-up"></i> Publicar Foto</button>
      <a href="{{ url_for('admin_galeria') }}" class="btn" style="background: var(--cinza-100); color: var(--preto); box-shadow: none;"><i class="fa-solid fa-xmark"></i> Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
