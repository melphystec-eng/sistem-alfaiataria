{% extends "base.html" %}
{% block title %}Contacto - Chat{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto; padding: 0; overflow: hidden; height: 75vh; display: flex; flex-direction: column;">

  <!-- Cabeçalho do Chat -->
  <div style="background: linear-gradient(135deg, var(--azul-esc) 0%, var(--azul) 100%); padding: 15px 20px; color: white; display: flex; align-items: center; gap: 15px;">
    <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
      <i class="fa-solid fa-headset" style="font-size: 1.2rem;"></i>
    </div>
    <div>
      <h2 style="margin: 0; color: white; font-size: 1.2rem;">Suporte Alfaiataria</h2>
      <small style="color: #dbeafe;">Normalmente responde em minutos</small>
    </div>
  </div>

  <!-- Área das Mensagens -->
  <div id="chat-box" style="flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 10px;">
    <!-- As mensagens aparecem aqui -->
  </div>

  <!-- Input de Envio -->
  <div style="padding: 15px; background: white; border-top: 1px solid var(--cinza-100); display: flex; gap: 10px;">
    <input type="text" id="chat-input" placeholder="Escreva a sua mensagem..." style="margin: 0; border-radius: 20px; flex: 1; background: #f1f5f9;" onkeypress="if(event.key === 'Enter') enviarMensagem()">
    <button onclick="enviarMensagem()" style="border-radius: 50%; width: 45px; height: 45px; padding: 0; min-height: 45px;">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>

<script>
const sala = "{{ session.get('cliente_sala') }}";
const chatBox = document.getElementById('chat-box');
const input = document.getElementById('chat-input');

function criarBalao(msg, meuTipo) {
  const isMeu = msg.tipo === meuTipo;
  const corFundo = isMeu ? 'var(--azul)' : 'white';
  const corTexto = isMeu ? 'white' : 'var(--preto)';
  const alinhamento = isMeu ? 'flex-end' : 'flex-start';
  const radius = isMeu ? '15px 15px 0 15px' : '15px 15px 15px 0';

  return `
    <div style="display: flex; flex-direction: column; align-items: ${alinhamento}; max-width: 80%; align-self: ${alinhamento};">
      ${!isMeu ? `<small style="color: var(--cinza-500); margin-bottom: 2px; font-size: 0.75rem;">${msg.nome}</small>` : ''}
      <div style="background: ${corFundo}; color: ${corTexto}; padding: 10px 15px; border-radius: ${radius}; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 0.95rem;">
        ${msg.mensagem}
      </div>
      <small style="color: var(--cinza-500); font-size: 0.65rem; margin-top: 4px;">${msg.hora}</small>
    </div>
  `;
}

async function carregarMensagens() {
  try {
    const response = await fetch(`/api/chat/receber/${sala}`);
    const data = await response.json();

    if (data.status === "erro") return;

    if (data.mensagens.length > 0) {
      chatBox.innerHTML = data.mensagens.map(m => criarBalao(m, data.meu_tipo)).join('');
      chatBox.scrollTop = chatBox.scrollHeight;

      // GUARDAR O ID DA ÚLTIMA MENSAGEM (Para limpar o alerta vermelho)
      const ultimoId = data.mensagens[data.mensagens.length - 1].id;
      localStorage.setItem('chat_last_id_cliente_' + sala, ultimoId);

    } else {
      chatBox.innerHTML = '<div style="text-align:center; color: #94a3b8; margin-top: 20px;"><i class="fa-regular fa-comments" style="font-size: 2rem; margin-bottom: 10px;"></i><br>Olá! Como podemos ajudar hoje?</div>';
    }
  } catch (e) {}
}


async function enviarMensagem() {
  const texto = input.value.trim();
  if (!texto) return;

  input.value = "";

  await fetch('/api/chat/enviar', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sala: sala, mensagem: texto})
  });

  carregarMensagens();
}

// Carrega ao abrir e depois a cada 3 segundos
carregarMensagens();
setInterval(carregarMensagens, 3000);

</script>
{% endblock %}
