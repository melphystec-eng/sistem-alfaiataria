{% extends "base.html" %}{% block title %}{{ n.titulo }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ n.titulo }}</h1>
  <small>{{ n.criada_em }} | <i class="fa-solid fa-eye"></i> {{ n.visualizacoes }}</small>

  {% if n.imagem %}
    <p style="margin-top: 15px;">
      <img src="{{ url_for('static', filename='uploads/' + n.imagem) }}" class="img-noticia" style="max-height: 600px;">
    </p>
  {% endif %}

  <p style="white-space:pre-line">{{ n.texto }}</p>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px; padding-top: 20px; border-top: 1px solid var(--cinza-100);">
    <a href="{{ url_for('reagir', id=n.id, acao='like') }}"><button><i class="fa-solid fa-thumbs-up"></i> Gosto ({{ n.likes }})</button></a>
    <a href="{{ url_for('reagir', id=n.id, acao='dislike') }}"><button class="btn-danger"><i class="fa-solid fa-thumbs-down"></i> Não gosto ({{ n.dislikes }})</button></a>
  </div>
</div>
{% endblock %}
